name: Deploy frontend

on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --coverage

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  build-and-deploy:
    # PRs only run the checks above; the image is built and deployed on
    # push to master, gated on lint/test/typecheck only. The full
    # round-by-round game-flow e2e coverage (real lobby, real backend, real
    # browser) moved to wom-e2e -- it was previously an in-repo blocking job
    # here, but its own real-stack setup cost + WebGL-rendering flakiness
    # under CI's GPU-less headless Chromium made it the long pole on every
    # deploy (up to 40 minutes, and prone to environmental stalls unrelated
    # to actual regressions -- see wom-e2e's PR for the migration). wom-e2e
    # now covers this via its nightly (03:00 UTC) + on-demand run instead of
    # gating every push; a real regression can reach prod and sit there
    # until the next wom-e2e run catches it, a deliberate speed/safety
    # tradeoff, not an oversight.
    if: github.event_name != 'pull_request'
    needs: [lint, test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          tags: |
            ghcr.io/mikaelra/wom-fe:latest
            ghcr.io/mikaelra/wom-fe:${{ github.sha }}

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The key's authorized_keys entry has a forced command, so this is
          # ignored server-side — it always runs deploy.sh frontend, nothing else.
          script: echo deploying
