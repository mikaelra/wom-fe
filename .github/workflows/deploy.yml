name: Deploy frontend

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          tags: |
            ghcr.io/mikaelra/wom-fe:latest
            ghcr.io/mikaelra/wom-fe:${{ github.sha }}

  approve:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Opens a GitHub issue and blocks here until you comment "approved" (or
      # react thumbs-up) on it, from the site or the GitHub Mobile app. Same
      # mechanism as wom-be, so both repos use one approval pathway.
      - uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: mikaelra
          minimum-approvals: 1
          issue-title: "Deploy wom-fe to production (${{ github.sha }})"
          issue-body: "Approve to deploy commit ${{ github.sha }} to production. Comment `approved` (or react 👍) to proceed, or `denied` to cancel."

  deploy:
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The key's authorized_keys entry has a forced command, so this is
          # ignored server-side — it always runs deploy.sh frontend, nothing else.
          script: echo deploying
